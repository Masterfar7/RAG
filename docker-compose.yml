version: '3.8'

services:
  # Qdrant Vector Search Engine
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vector_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage

  # n8n Workflow Automation with AI nodes
  n8n:
    image: n8nio/n8n:latest
    container_name: automation_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Moscow
    volumes:
      - ./data/n8n_data:/home/node/.n8n
